<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENICE Administration</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#18214d;--mut:#7b86a6;--bd:#e9edf5;--hd:#f5f7fb;--pill:#eef1f7;--blue:#2f66f0}
[data-t=dark]{--bg:#0f1530;--card:#171f45;--tx:#e8ecff;--mut:#8f9bc4;--bd:#2a3466;--hd:#1d2650;--pill:#26305f}
*{box-sizing:border-box;margin:0}
body{font:13px/1.5 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:248px;background:linear-gradient(180deg,var(--sb1),var(--sb2));color:#cdd5f4;padding:20px 14px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 22px;color:#fff;font-weight:800;font-size:17px;line-height:1.1}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#a855f7);display:grid;place-items:center;font-style:normal}
.logo span{display:block;font-size:10px;font-weight:500;letter-spacing:.12em;color:#9aa6dc}
aside h6{font-size:10px;letter-spacing:.12em;color:#8390c9;margin:16px 12px 6px}
aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;color:#cdd5f4;cursor:pointer;font-size:14px;margin-bottom:2px}
aside a:hover{background:var(--sb3)}aside a.on{background:var(--blue);color:#fff}
aside a em{margin-left:auto;font-style:normal;font-size:11px;background:var(--sb4);border-radius:10px;padding:0 8px}
.foot{margin-top:auto;border-top:1px solid var(--sb4);padding-top:12px}
.user{display:flex;gap:10px;align-items:center;background:var(--sb3);border-radius:12px;padding:10px;margin-top:10px}
.user i{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--blue);font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center}
.user div{flex:1;font-size:12px;line-height:1.3}.user small{color:#9aa6dc}
.user button{background:var(--sb5);color:#fff;border:0;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:11px}
main{flex:1;min-width:0}
header{display:flex;gap:12px;align-items:center;padding:14px 32px;background:var(--card);border-width:0 0 3px;border-style:solid;border-image:linear-gradient(90deg,var(--blue),#a855f7,#ec4899,#f59e0b,#14b8a6) 1;position:sticky;top:0;z-index:5}
.crumb{color:var(--mut)}.crumb b{color:var(--tx)}
.hq{margin-left:auto;width:260px;padding:9px 14px;border:1px solid var(--bd);border-radius:9px;background:var(--hd);color:var(--tx)}
.live{font-size:11px;font-weight:700;color:#15935f;background:#e0f7ee;border-radius:20px;padding:5px 12px}
.ic{width:36px;height:36px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;cursor:pointer}
.wrap{padding:26px 32px 40px}
.eye{font-size:11px;letter-spacing:.1em;color:var(--mut)}h1{font-size:25px;margin:2px 0 2px;letter-spacing:-.01em}.sub{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-weight:500;transition:all .15s}
.btn:hover{border-color:var(--blue)}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.p:hover{opacity:.92}.btn:disabled{opacity:.4;cursor:default}
.btn.e{background:var(--acl);color:var(--acx);border-color:var(--acb);padding:6px 12px;font-size:12px}.btn.d{background:#fdecee;color:#e5484d;border-color:#f9d3d7;padding:6px 12px;font-size:12px}
.card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--bd);transition:box-shadow .2s}.card h3{font-size:15px}.mut{color:var(--mut)}.xs{font-size:11px}
.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g2eq{grid-template-columns:1fr 1fr}.g2b{grid-template-columns:1.6fr 1fr}.g4b{grid-template-columns:1fr 1fr}
.num{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.th{width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--pill);flex:none;display:block}
.row .n{flex:1;min-width:0}.row .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;background:#e0f7ee;color:#15935f;white-space:nowrap}.tag.o{background:#fff1d6;color:#b86e00}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--pill);white-space:nowrap}
.qa{border:1px solid var(--bd);border-radius:10px;padding:14px;cursor:pointer;background:var(--card);color:var(--tx);text-align:left;font:inherit}.qa b{display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1000px}
th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--mut);padding:12px 10px;background:var(--hd);white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--bd);vertical-align:middle}
.sw{margin:0;vertical-align:middle;position:relative;width:34px;height:20px;display:inline-block}.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#d5dae6;border-radius:20px;transition:.2s}
.sw i:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:#22b07d}.sw input:checked+i:before{transform:translateX(14px)}.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.fl{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}.fl .sp{margin-left:auto}
.fl input,.fl select,.pg select{padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);font:inherit}.fl input{min-width:240px}
.pg{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}.pg div{display:flex;gap:8px;align-items:center}
.tiles{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.tile{border:1px solid var(--bd);border-radius:10px;padding:12px 16px;min-width:190px;cursor:pointer;background:var(--card);color:var(--tx);text-align:left;font:inherit}
.tile.on{border-color:var(--blue);background:var(--acl)}.tile b{display:block}
form.st input{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);font:inherit}form.st input:disabled{opacity:.7}
form.st small{display:block;margin-top:10px;min-height:18px;color:#d6303a}form.st small.ok{color:#15935f}
dialog{border:0;border-radius:16px;padding:24px;width:640px;max-width:94vw;background:var(--card);color:var(--tx);box-shadow:0 24px 70px #1b255966}
dialog::backdrop{background:#1b255988}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
dialog input:not([type=checkbox]),dialog textarea,dialog select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.chk{display:flex;gap:18px;margin-top:12px}.chk label{margin:0;color:var(--tx);font-size:13px}
#toast{position:fixed;right:24px;bottom:24px;background:#334168;color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:20}

/* ---------- HỆ THỐNG BÁO CÁO TƯƠNG TÁC ---------- */
.rbar{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(24,33,77,.03)}
.rbar-grp{display:flex;align-items:center;gap:6px;background:var(--hd);padding:4px;border-radius:10px;border:1px solid var(--bd)}
.rpill{border:0;background:transparent;color:var(--mut);padding:6px 12px;border-radius:7px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.rpill:hover{color:var(--tx)}.rpill.on{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(47,102,240,.3)}
.rsel{padding:7px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--hd);color:var(--tx);font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.rbadge{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.ch-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch-leg{display:flex;gap:14px;font-size:12px;align-items:center;flex-wrap:wrap}
.ch-leg span{display:inline-flex;align-items:center;gap:6px;color:var(--mut)}
.ch-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ch-box{position:relative;width:100%;user-select:none}
.svg-ch{width:100%;height:auto;display:block;overflow:visible}
.ch-bar{transition:opacity .15s,transform .15s;cursor:pointer}.ch-bar:hover{opacity:.82}
.ch-pt{cursor:pointer;transition:r .15s}.ch-pt:hover{r:6.5}
.donut-wrap{display:flex;align-items:center;gap:20px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.donut-svg{width:168px;height:168px;flex:none;overflow:visible}
.donut-seg{cursor:pointer;transition:transform .2s,opacity .15s;transform-origin:84px 84px}
.donut-seg:hover{transform:scale(1.04);opacity:.9}
.donut-list{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px}
.d-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;background:var(--hd);cursor:pointer;border:1px solid transparent;transition:all .15s}
.d-item:hover{border-color:var(--blue);background:var(--acl)}
.d-item-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.d-item-l i{width:10px;height:10px;border-radius:50%;flex:none}
.cmp-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.cmp-row{cursor:pointer;padding:6px 8px;border-radius:9px;transition:background .15s}
.cmp-row:hover{background:var(--hd)}
.cmp-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.cmp-track{height:10px;background:var(--pill);border-radius:99px;overflow:hidden;display:flex;gap:2px}
.cmp-fill{height:100%;border-radius:99px;transition:width .4s ease}
#ctip{position:fixed;pointer-events:none;z-index:99;background:rgba(15,21,48,.95);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);display:none;min-width:170px;backdrop-filter:blur(6px)}
#ctip b{display:block;font-size:13px;margin-bottom:4px;color:#fff}
#ctip .tr{display:flex;justify-content:space-between;gap:14px;color:#cbd5e1}
#ctip .tr strong{color:#fff}
#ctip .hint{margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;color:#93c5fd}
.stc.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}.stc.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(24,33,77,.07)}

.tag.g{background:var(--pill);color:var(--mut)}
.out{flex:none;background:#dc2626;color:#fff;border:0;border-radius:9px;padding:9px 16px;min-height:38px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 2px 8px #dc262655;transition:background .15s}.out:hover{background:#b91c1c}.out:focus-visible{outline:3px solid #fca5a5;outline-offset:2px}.out:disabled{opacity:.6;cursor:wait}
.mb,#fab{display:none}#bd{display:none}
#fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;font-size:28px;line-height:1;padding:0;place-items:center;z-index:20;box-shadow:0 8px 24px #2f66f066}
@media(max-width:900px){
 aside{position:fixed;z-index:40;left:0;top:0;height:100vh;height:100dvh;transform:translateX(-102%);transition:transform .25s;overflow-y:auto}body.nav aside{box-shadow:0 0 40px #0008}
 body.nav aside{transform:none}body.nav #bd{display:block;position:fixed;inset:0;background:#0007;z-index:35}
 .mb{display:inline-grid;place-items:center}#fab:not([hidden]){display:grid}
 header{padding:10px 14px;gap:8px}.hq{flex:1;min-width:0;width:auto;margin-left:0}.live,.crumb{display:none}
 .wrap{padding:16px 14px 96px}h1{font-size:21px}
 .g4{grid-template-columns:1fr 1fr}.g2,.g2eq,.g2b,.g4b{grid-template-columns:1fr}
 .rbadge{margin-left:0;width:100%;justify-content:space-between}
}
@media(max-width:760px){
 .out{padding:8px 12px;min-height:44px}
 body{font-size:14px}.card{padding:16px}
 .top>div:last-child{width:100%;display:flex;gap:8px;flex-wrap:wrap}.top .btn{flex:1}
 .btn,.fl select,.fl input,.pg select{min-height:44px}.btn.e,.btn.d{min-height:42px;padding:8px 14px}
 input,select,textarea{font-size:16px!important}
 .fl{flex-direction:column;align-items:stretch}.fl input{min-width:0;width:100%}.fl .sp{margin-left:0}
 .tw{overflow:visible}table,tbody,tr,td{display:block;width:100%;min-width:0!important}table tr:first-child{display:none}
 tr{border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;padding:8px 12px;background:var(--card)}
 td{border:0!important;padding:7px 0!important;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
 td[data-l]::before{content:attr(data-l);color:var(--mut);font-size:11px;letter-spacing:.05em;text-align:left;flex:none}
 td[data-h]{display:block;text-align:left}
 .row{flex-wrap:wrap}.row .btn{flex:1}
 dialog{width:100vw;max-width:100vw;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;border-radius:0;margin:0;overflow-y:auto}
 .two{grid-template-columns:1fr}.chk{flex-direction:column;gap:10px}
 .sw{width:46px;height:26px}.sw i:before{width:20px;height:20px;top:3px;left:3px}.sw input:checked+i:before{transform:translateX(20px)}
 .pg{flex-direction:column;align-items:stretch}.pg div{justify-content:space-between}
 #toast{left:16px;right:16px;bottom:84px;text-align:center}
}
/* ---------- MÀU SẮC & CHỦ ĐỀ MÀU ---------- */
:root{--ac2:#1d4ed8;--acl:rgba(47,102,240,.12);--acb:rgba(47,102,240,.28);--acx:#2f66f0;--sb1:#1b2559;--sb2:#151d4a;--sb3:#243070;--sb4:#2c3a78;--sb5:#3a4789}

aside a.on span{color:#fff!important}
.stc{position:relative;overflow:hidden;padding-left:24px}.stc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.stc .l{padding-right:46px}.stc .chip{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:12px;background:var(--cl);color:var(--c);display:grid;place-items:center;font-size:18px}
.s1{--c:#2f66f0;--cl:rgba(47,102,240,.13)}.s2{--c:#16a34a;--cl:rgba(22,163,74,.14)}.s3{--c:#ea580c;--cl:rgba(234,88,12,.14)}.s4{--c:#9333ea;--cl:rgba(147,51,234,.14)}
.k1{border-top:3px solid #2f66f0}.k2{border-top:3px solid #f59e0b}.k3{border-top:3px solid #14b8a6}.k4{border-top:3px solid #ec4899}.k5{border-top:3px solid var(--blue)}.k6{border-top:3px solid #a855f7}
.pill.c{background:hsl(var(--h) 80% 92%);color:hsl(var(--h) 60% 28%)}[data-t=dark] .pill.c{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 85% 85%)}
.pill.hot{background:#fee2e2;color:#b91c1c}[data-t=dark] .pill.hot{background:#4c1d24;color:#fca5a5}

[data-t=dark] .live,[data-t=dark] .tag{background:rgba(34,197,94,.16);color:#86efac}[data-t=dark] .tag.o{background:rgba(245,158,11,.16);color:#fcd34d}[data-t=dark] .tag.g{background:var(--pill);color:var(--mut)}

<script>
const IMG=location.hostname==='localhost'?'http://localhost:3001/':'https://enice.vn/';
const CATS={'Ngâm Thường':'Bồn Tắm Ngâm Việt Nam','Nhập Khẩu':'Bồn Tắm Nhập Khẩu','Phòng Xông Hơi':'Phòng Xông Hơi','Massage':'Bồn Tắm Massage VN','Bồn cầu':'Bồn Cầu','Sen Vòi':'Sen Vòi Treo Tường','Cây sen đặt sàn':'Cây sen đặt sàn','Tủ Nhựa':'Tủ Nhựa PVC Cao Cấp','lavabo':'Lavabo','Bàn Đá':'Bàn Đá','Gương':'Gương Soi Đèn Led','Vòi Lavabo':'Vòi Lavabo Nóng Lạnh','Vòi Chén':'Vòi Chén Nóng Lạnh','Vòi Vệ Sinh':'Vòi Xịt Vệ Sinh','Bộ Xả':'Bộ Xả Thoát Nước LVB','Bồn Rửa Bát':'Bồn Rửa Bát Inox','Phụ Kiện':'Phụ Kiện Phòng Tắm'};
const NAV=[['dash','Tổng quan','▦','#60a5fa'],['prod','Sản phẩm','▣','#34d399'],['trash','Thùng rác','♲','#f87171'],['cat','Danh mục','☰','#fbbf24'],['mkt','Marketing & Ưu đãi','✦','#f472b6'],['quote','Yêu cầu báo giá','▧','#a78bfa'],['warranty','Bảo hành','◇','#22d3ee'],'Hệ thống',['db','Cơ sở dữ liệu & Sao lưu','▣','#94a3b8'],['settings','Cài đặt','⚙','#fb923c']];
const NAMES={dash:'Tổng quan',prod:'Sản phẩm',trash:'Thùng rác',cat:'Danh mục',mkt:'Marketing & Ưu đãi',quote:'Yêu cầu báo giá',warranty:'Bảo hành',db:'Cơ sở dữ liệu & Sao lưu',settings:'Cài đặt'};
// State mở rộng thêm bộ lọc cho dashboard (rRange, rCat, rGroup, rMetric)
const S={page:'dash',q:'',st:'',cat:'',n:10,pg:0,sel:new Set(),c2:'',q2:'',k2:'',rRange:'all',rCat:'',rGroup:'all',rMetric:'count'};
let D=[],TR=[],rows=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const vnd=n=>n?n.toLocaleString('vi-VN')+' ₫':'Liên hệ';
const catLabel=b=>CATS[b]||b||'';
const catOpts=cur=>Object.entries(CATS).map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('')+(cur&&!CATS[cur]?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:'');
const api=(u,o)=>fetch('/api/admin/'+u,o).then(async r=>{const j=await r.json().catch(()=>({}));if(r.status===401&&j.error==='Chưa đăng nhập'){location.replace('/login');throw new Error('Phiên đăng nhập đã hết hạn')}if(!r.ok)throw new Error(j.error||r.status);return j});
let ME={username:''},PR=[],ST=null;
const au=async(u,b)=>{const r=await fetch('/auth/'+u,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&j.error==='Chưa đăng nhập'){location.replace('/login');throw new Error('Phiên đăng nhập đã hết hạn')}if(!r.ok)throw new Error(j.error||'Có lỗi xảy ra');return j};
const showMe=()=>{const n=ME.username||'Quản trị viên';$('#uName').textContent=n;$('#uMail').textContent='Quản trị viên';$('#uAv').textContent=n.slice(0,2).toUpperCase()};
async function logout(){const b=$('#lo');if(b)b.disabled=true;try{await fetch('/auth/logout',{method:'POST',credentials:'same-origin'})}catch(_){}location.replace('/login')}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const thumb=p=>p.img1?`<img class="th" src="${IMG+esc(p.img1)}" alt="" loading="lazy">`:'<span class="th"></span>';
const missing=p=>!p.img1||!p.price;
const stockTxt=p=>p.stock==null?'<span class="mut">—</span>':p.stock===0?'<b style="color:#e5484d">Hết hàng</b>':p.stock;
const sizeTxt=p=>{const a=p.size||[];return a.length?esc(a[0])+(a.length>1?` <span class="mut" title="${esc(a.join(' | '))}">+${a.length-1}</span>`:''):'<span class="mut">—</span>'};
const priceHtml=p=>p.salePrice&&p.salePrice<p.price?`<b>${vnd(p.salePrice)}</b><br><s class="mut xs">${vnd(p.price)}</s>`:`<b>${vnd(p.price)}</b>`;
const sku=p=>p.sku||'ENICE-'+p.id;

async function load(){try{[D,TR,ME,PR,ST]=await Promise.all([api('products'),api('trash'),au('me'),api('promotions').catch(()=>[]),api('stats').catch(()=>null)]);showMe();draw()}catch(e){$('#view').innerHTML='<div class="card">Không tải được dữ liệu: '+esc(e.message)+'. Kiểm tra web sản phẩm đã chạy và API key đúng chưa.</div>'}}

function draw(){
  $('#nav').innerHTML=NAV.map(n=>typeof n==='string'?`<h6>${n.toUpperCase()}</h6>`:`<a data-p="${n[0]}" class="${n[0]===S.page?'on':''}"><span style="color:${n[3]||'inherit'}">${n[2]}</span>${n[1]}${n[0]==='prod'?`<em>${D.length}</em>`:n[0]==='trash'?`<em>${TR.length}</em>`:''}</a>`).join('');
  document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.p));
  $('#crumb').textContent=NAMES[S.page];$('#fab').hidden=!['dash','prod','mkt'].includes(S.page);
  $('#view').innerHTML=({dash,prod,cat,mkt,trash,settings}[S.page]||soon)();
  if(S.page==='prod')listP();if(S.page==='cat')listC();markC();
}
const go=p=>{document.body.classList.remove('nav');S.page=p;S.pg=0;S.sel.clear();draw();scrollTo(0,0)};
const head=(eye,t,sub,act='')=>`<div class="top"><div><div class="eye">${eye}</div><h1>${t}</h1><div class="sub">${sub}</div></div><div>${act}</div></div>`;
const soon=()=>head('HỆ THỐNG',NAMES[S.page],'Chức năng này đang được phát triển.')+'<div class="card mut">Chưa có dữ liệu. Phần này sẽ được bổ sung sau.</div>';

/* ---------- HỆ THỐNG BÁO CÁO TƯƠNG TÁC (DASHBOARD) ---------- */
const tip=$('#ctip');
function showTip(e,title,rows,hint='Nhấn vào biểu đồ để xem danh sách chi tiết'){
  tip.innerHTML=`<b>${esc(title)}</b>`+rows.map(([k,v])=>`<div class="tr"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')+(hint?`<div class="hint">↗ ${esc(hint)}</div>`:'');
  tip.style.display='block';moveTip(e);
}
function moveTip(e){
  if(tip.style.display==='none')return;
  const x=Math.min(window.innerWidth-tip.offsetWidth-14,e.clientX+14);
  const y=Math.min(window.innerHeight-tip.offsetHeight-14,e.clientY+14);
  tip.style.left=Math.max(10,x)+'px';tip.style.top=Math.max(10,y)+'px';
}
const hideTip=()=>{tip.style.display='none'};
document.addEventListener('mousemove',moveTip);

// Mở modal xem danh sách sản phẩm khi click vào bất kỳ phần tử biểu đồ nào
function drillDown(title,subtitle,list){
  hideTip();
  const f=$('#f');
  f.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px">
    <div><h3>${esc(title)}</h3><div class="mut xs">${esc(subtitle)} (${list.length} sản phẩm)</div></div>
    <button type="button" class="btn" onclick="$('#dlg').close()">✕ Đóng</button>
  </div>
  <div style="max-height:60vh;overflow-y:auto;border-top:1px solid var(--bd)">
    ${list.map(p=>`<div class="row">${thumb(p)}<div class="n"><b>${esc(p.name)}</b><span class="mut xs">${esc(sku(p))} · ${esc(catLabel(p.brand))} · ${vnd(p.salePrice||p.price)}</span></div>
    <span class="tag ${p.hidden?'o':''}">${p.hidden?'Đang ẩn':'Đang hiển thị'}</span>
    <button type="button" class="btn e" onclick="edit(${p.id})">Sửa</button></div>`).join('')||'<p class="mut" style="padding:16px 0">Không có sản phẩm nào trong nhóm này.</p>'}
  </div>`;
  $('#dlg').showModal();
}

function getFilteredDash(){
  const now=Date.now();
  const daysMap={'7d':7,'30d':30,'90d':90,'180d':180,'all':0};
  const days=daysMap[S.rRange]||0;
  return D.filter(p=>{
    if(S.rCat && p.brand!==S.rCat)return false;
    if(S.rGroup==='show' && p.hidden)return false;
    if(S.rGroup==='hide' && !p.hidden)return false;
    if(S.rGroup==='top' && !p.isTopseller)return false;
    if(S.rGroup==='sale' && !(p.salePrice && p.salePrice<p.price))return false;
    if(S.rGroup==='out' && p.stock!==0)return false;
    if(S.rGroup==='miss' && !missing(p))return false;
    if(days>0){
      const dt=Date.parse(p.updatedAt||p.createdAt||'');
      if(!isNaN(dt) && (now-dt)>days*864e5)return false;
    }
    return true;
  });
}

function dash(){
  const FD=getFilteredDash();
  const totalFiltered=FD.length;
  const shown=FD.filter(p=>!p.hidden).length;
  const hiddenCount=FD.filter(p=>p.hidden).length;
  const topCount=FD.filter(p=>p.isTopseller).length;
  const saleCount=FD.filter(p=>p.salePrice&&p.salePrice<p.price).length;
  const outCount=FD.filter(p=>p.stock===0).length;
  const miss=FD.filter(missing).length;
  const hidClean=FD.filter(p=>!missing(p)&&p.hidden).length;
  const okClean=Math.max(0,totalFiltered-miss-hidClean);
  const invVal=FD.reduce((s,p)=>s+(Number(p.salePrice||p.price)||0)*(p.stock!=null?Number(p.stock):1),0);

  // 1. Dữ liệu Biểu đồ Cột nhóm (Biến động sản phẩm theo tháng)
  const monthN=S.rRange==='7d'||S.rRange==='30d'?4:S.rRange==='90d'?3:6;
  const ms=[],now=new Date();
  for(let i=monthN-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    ms.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:'Tháng '+(d.getMonth()+1),short:'T'+(d.getMonth()+1),a:0,b:0,itemsA:[],itemsB:[]});
  }
  FD.forEach(p=>ms.forEach(m=>{
    if((p.createdAt||'').startsWith(m.k)){m.a++;m.itemsA.push(p)}
    if((p.updatedAt||'').startsWith(m.k)&&p.updatedAt!==p.createdAt){m.b++;m.itemsB.push(p)}
  }));
  const maxBar=Math.max(1,...ms.map(m=>Math.max(m.a,m.b)));

  // 2. Dữ liệu Biểu đồ Đường (Lượt truy cập trang chủ bán hàng)
  const S0=ST||{today:0,uniqToday:0,week:0,month:0,total:0,series:[]};
  const sliceDays=S.rRange==='7d'?7:14;
  const sv=(S0.series||[]).slice(-sliceDays);
  const maxLine=Math.max(1,...sv.map(x=>x.v));

  // 3. Dữ liệu Biểu đồ Tròn (Donut - Phân bổ trạng thái sản phẩm)
  const donutData=[
    {id:'ok',label:'Đang hiển thị chuẩn',val:okClean,color:'#2f66f0',list:FD.filter(p=>!missing(p)&&!p.hidden)},
    {id:'hid',label:'Đang ẩn trên web',val:hidClean,color:'#f59e0b',list:FD.filter(p=>!missing(p)&&p.hidden)},
    {id:'miss',label:'Thiếu ảnh / giá',val:miss,color:'#14b8a6',list:FD.filter(missing)}
  ];
  const dTotal=Math.max(1,totalFiltered);
  const R=62,C=2*Math.PI*R;
  let offset=0;
  const donutSegs=donutData.map(seg=>{
    const pct=seg.val/dTotal;
    const dash=pct*C;
    const curOff=offset;
    offset+=dash;
    return {...seg,pct:(pct*100).toFixed(1),dash,curOff};
  });

  // 4. Dữ liệu Biểu đồ So sánh danh mục (Top 6 danh mục)
  const catMap={};
  FD.forEach(p=>{
    const b=p.brand||'Khác';
    if(!catMap[b])catMap[b]={brand:b,label:catLabel(b),count:0,shown:0,value:0,items:[]};
    catMap[b].count++;
    if(!p.hidden)catMap[b].shown++;
    catMap[b].value+=(Number(p.salePrice||p.price)||0);
    catMap[b].items.push(p);
  });
  const catRank=Object.values(catMap).sort((a,b)=>S.rMetric==='value'?b.value-a.value:b.count-a.count).slice(0,6);
  const maxCmp=Math.max(1,...catRank.map(c=>S.rMetric==='value'?c.value:c.count));

  // Lưu tham chiếu tạm để sự kiện inline gọi drillDown nhanh
  window._D_STATE={ms,donutData,catRank,FD};

  const liveN=PR.filter(p=>prSt(p)[0]==='Đang hiển thị').length,draftN=PR.filter(p=>!p.published).length;
  const rec=[...FD].sort((x,y)=>(y.updatedAt||'').localeCompare(x.updatedAt||'')||y.id-x.id).slice(0,5);
  const hasFilter=S.rRange!=='all'||S.rCat!==''||S.rGroup!=='all';

  // Render SVG Biểu đồ Cột nhóm
  const barW=460,barH=175,padL=28,padB=24,plotW=barW-padL-10,plotH=barH-padB-12;
  const colStep=plotW/Math.max(1,ms.length);
  const barSvg=`<svg class="svg-ch" viewBox="0 0 ${barW} ${barH}">
    ${[0,0.5,1].map(t=>{
      const y=12+plotH*(1-t),val=Math.round(maxBar*t);
      return `<line x1="${padL}" y1="${y}" x2="${barW-6}" y2="${y}" stroke="var(--bd)" stroke-dasharray="${t?3:0}"/>
              <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="var(--mut)" font-size="10">${val}</text>`;
    }).join('')}
    ${ms.map((m,i)=>{
      const cx=padL+colStep*i+colStep/2;
      const bw=Math.min(20,colStep*0.28);
      const hA=(m.a/maxBar)*plotH,hB=(m.b/maxBar)*plotH;
      const yA=12+plotH-hA,yB=12+plotH-hB;
      return `<g>
        <rect class="ch-bar" x="${cx-bw-2}" y="${yA}" width="${bw}" height="${Math.max(hA,m.a?3:0)}" rx="4" fill="var(--blue)"
          onmouseenter="showTip(event,'${m.l} · Thêm mới',[['Sản phẩm mới','${m.a} SP'],['Tỷ trọng','${(m.a/dTotal*100).toFixed(1)}%']])"
          onmouseleave="hideTip()"
          onclick="drillDown('Sản phẩm thêm mới · ${m.l}','Danh sách sản phẩm tạo trong ${m.l}',window._D_STATE.ms[${i}].itemsA)"/>
        <rect class="ch-bar" x="${cx+2}" y="${yB}" width="${bw}" height="${Math.max(hB,m.b?3:0)}" rx="4" fill="#f59e0b"
          onmouseenter="showTip(event,'${m.l} · Cập nhật',[['Sản phẩm cập nhật','${m.b} SP'],['Tỷ trọng','${(m.b/dTotal*100).toFixed(1)}%']])"
          onmouseleave="hideTip()"
          onclick="drillDown('Sản phẩm cập nhật · ${m.l}','Danh sách sản phẩm chỉnh sửa trong ${m.l}',window._D_STATE.ms[${i}].itemsB)"/>
        <text x="${cx}" y="${barH-6}" text-anchor="middle" fill="var(--mut)" font-size="11">${m.short}</text>
      </g>`;
    }).join('')}
  </svg>`;

  // Render SVG Biểu đồ Đường (Traffic)
  const lnW=460,lnH=175,lPadL=32,lPadB=24,lPlotW=lnW-lPadL-12,lPlotH=lnH-lPadB-14;
  const pts=sv.map((x,i)=>{
    const px=lPadL+(sv.length>1?(i/(sv.length-1))*lPlotW:lPlotW/2);
    const py=14+lPlotH*(1-x.v/maxLine);
    return {x:px,y:py,d:x.d,v:x.v};
  });
  const polyPts=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPts=pts.length?`${pts[0].x.toFixed(1)},${14+lPlotH} ${polyPts} ${pts[pts.length-1].x.toFixed(1)},${14+lPlotH}`:'';
  const lineSvg=pts.length?`<svg class="svg-ch" viewBox="0 0 ${lnW} ${lnH}">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#14b8a6" stop-opacity="0.28"/><stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/></linearGradient></defs>
    ${[0,0.5,1].map(t=>{
      const y=14+lPlotH*(1-t),val=Math.round(maxLine*t);
      return `<line x1="${lPadL}" y1="${y}" x2="${lnW-8}" y2="${y}" stroke="var(--bd)" stroke-dasharray="${t?3:0}"/>
              <text x="${lPadL-6}" y="${y+3}" text-anchor="end" fill="var(--mut)" font-size="10">${val}</text>`;
    }).join('')}
    <polygon points="${areaPts}" fill="url(#areaGrad)"/>
    <polyline fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyPts}"/>
    ${pts.map((p,i)=>`<g>
      <circle class="ch-pt" cx="${p.x}" cy="${p.y}" r="4.2" fill="var(--card)" stroke="#14b8a6" stroke-width="2.5"
        onmouseenter="showTip(event,'Ngày ${p.d.split('-').reverse().join('/')}',[['Lượt truy cập','${p.v} lượt'],['So với đỉnh','${Math.round(p.v/maxLine*100)}%']],'Dữ liệu đồng bộ từ trang bán hàng')"
        onmouseleave="hideTip()"/>
      ${(sv.length<=8||i%2===0)?`<text x="${p.x}" y="${lnH-6}" text-anchor="middle" fill="var(--mut)" font-size="10">${p.d.slice(8)}/${p.d.slice(5,7)}</text>`:''}
    </g>`).join('')}
  </svg>`:'<div class="mut xs" style="padding:46px 0;text-align:center">Chưa có dữ liệu chuỗi thời gian từ website bán hàng.</div>';

  return head('BÁO CÁO TƯƠNG TÁC · BẢNG ĐIỀU KHIỂN','Tổng quan & Phân tích cửa hàng','Di chuột vào biểu đồ để xem chỉ số chi tiết hoặc nhấn trực tiếp để khám phá danh sách sản phẩm.',
    '<button class="btn" onclick="load()">↻ Làm mới</button> <button class="btn p" onclick="edit()">+ Thêm sản phẩm</button>')+

  // THANH BỘ LỌC TƯƠNG TÁC
  `<div class="rbar">
    <div class="rbar-grp" role="group" aria-label="Khoảng thời gian">
      ${[['all','Tất cả'],['7d','7 ngày'],['30d','30 ngày'],['90d','3 tháng'],['180d','6 tháng']].map(([k,lb])=>
        `<button type="button" class="rpill ${S.rRange===k?'on':''}" onclick="S.rRange='${k}';draw()">${lb}</button>`).join('')}
    </div>
    <select class="rsel" onchange="S.rCat=this.value;draw()" aria-label="Lọc danh mục">
      <option value="">Tất cả danh mục (${Object.keys(CATS).length})</option>${catOpts(S.rCat)}
    </select>
    <select class="rsel" onchange="S.rGroup=this.value;draw()" aria-label="Nhóm dữ liệu">
      ${[['all','Nhóm: Tất cả sản phẩm'],['show','Đang hiển thị trên web'],['hide','Đang ẩn'],['top','Sản phẩm bán chạy'],['sale','Đang giảm giá / Ưu đãi'],['out','Đã hết hàng'],['miss','Thiếu ảnh hoặc giá']].map(([v,l])=>
        `<option value="${v}" ${S.rGroup===v?'selected':''}>${l}</option>`).join('')}
    </select>
    ${hasFilter?`<button type="button" class="btn" style="padding:6px 12px;font-size:12px" onclick="S.rRange='all';S.rCat='';S.rGroup='all';draw()">✕ Xóa bộ lọc</button>`:''}
    <div class="rbadge"><span>Đang phân tích: <b style="color:var(--tx)">${totalFiltered}</b> / ${D.length} SP</span></div>
  </div>`+

  // 4 THẺ KPI TƯƠNG TÁC (NHẤN ĐỂ XEM DANH SÁCH)
  `<div class="grid g4">
    <div class="card stc s1 clickable" onclick="drillDown('Danh sách sản phẩm đang lọc','Toàn bộ sản phẩm khớp với bộ lọc hiện tại',window._D_STATE.FD)">
      <span class="chip">▣</span><div class="mut xs l">SẢN PHẨM TRONG BÁO CÁO</div><div class="num">${totalFiltered}</div>
      <div class="mut xs">${shown} hiển thị · ${hiddenCount} đang ẩn</div>
    </div>
    <div class="card stc s2 clickable" onclick="drillDown('Sản phẩm bán chạy & Khuyến mãi','Nhóm sản phẩm nổi bật trong bộ lọc',window._D_STATE.FD.filter(p=>p.isTopseller||(p.salePrice&&p.salePrice<p.price)))">
      <span class="chip">★</span><div class="mut xs l">BÁN CHẠY &amp; GIẢM GIÁ</div><div class="num">${topCount} <span style="font-size:15px;font-weight:600;color:var(--mut)">/ ${saleCount} sale</span></div>
      <div class="mut xs">Chiếm ${totalFiltered?(topCount/totalFiltered*100).toFixed(1):0}% nhóm đang xem</div>
    </div>
    <div class="card stc s3 clickable" onclick="go('prod')">

function mkt(){
  const live=PR.filter(p=>prSt(p)[0]==='Đang hiển thị').length;
  return head('MARKETING & ƯU ĐÃI','Marketing &amp; Ưu đãi','Tạo bài giảm giá, chương trình ưu đãi. Bài đã đăng sẽ hiện ở trang chủ bán hàng cho khách xem.','<button class="btn p" onclick="editPromo()">+ Tạo bài ưu đãi</button>')+
  `<div class="card"><div class="mut xs" style="margin-bottom:10px">${PR.length} bài · ${live} đang hiển thị ở trang chủ</div><div class="tw"><table style="min-width:860px"><tr><th>BÀI VIẾT</th><th>ƯU ĐÃI</th><th>THỜI GIAN</th><th>TRẠNG THÁI</th><th>ĐĂNG</th><th>THAO TÁC</th></tr>
  ${[...PR].sort((a,b)=>b.id-a.id).map(p=>{const[st,c]=prSt(p);return `<tr><td data-h><div style="display:flex;gap:12px;align-items:center">${thumbP(p)}<div><b>${esc(p.title)}</b><div class="mut xs">${esc((p.summary||'').slice(0,80))}</div></div></div></td>
   <td data-l="Ưu đãi">${p.badge?`<span class="pill hot">${esc(p.badge)}</span>`:'<span class="mut">—</span>'}</td><td data-l="Thời gian" class="xs">${dr(p)}</td><td data-l="Trạng thái"><span class="tag ${c}">${st}</span></td>
   <td data-l="Đăng"><label class="sw"><input type="checkbox" ${p.published?'checked':''} onchange="togPr(${p.id},this.checked)" aria-label="Đăng lên trang chủ"><i></i></label></td>
   <td data-l="Thao tác" style="white-space:nowrap"><button class="btn e" onclick="editPromo(${p.id})">✎ Sửa</button> <button class="btn d" onclick="delPr(${p.id})">⌫ Xóa</button></td></tr>`}).join('')||'<tr><td colspan="6" class="mut">Chưa có bài nào. Bấm “Tạo bài ưu đãi” để bắt đầu.</td></tr>'}</table></div></div>`;
}
async function togPr(id,v){const p=PR.find(x=>x.id===id);try{Object.assign(p,await api('promotions/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,published:v})}));toast(v?'Đã đăng lên trang chủ':'Đã chuyển thành bản nháp')}catch(e){toast('Lỗi: '+e.message)}draw()}
const delPr=id=>confirm('Xóa bài ưu đãi này? Bài sẽ biến mất khỏi trang chủ.')&&act('promotions/'+id,'DELETE','Đã xóa bài');
function editPromo(id){
  const p=PR.find(x=>x.id===id)||{published:true},f=$('#f');
  f.innerHTML=`<h3>${id?'Sửa bài ưu đãi':'Tạo bài ưu đãi'}</h3>
  <label for="pt">Tiêu đề bài viết</label><input id="pt" name="title" required maxlength="120" value="${esc(p.title)}" placeholder="VD: Giảm 20% bồn tắm massage">
  <div class="two"><div><label>Nhãn giảm giá (hiện trên ảnh)</label><input name="badge" maxlength="20" value="${esc(p.badge)}" placeholder="-20%"></div><div><label>Ảnh bài viết (jpg, png, webp, tối đa 5MB)</label><input name="file" type="file" accept="image/jpeg,image/png,image/webp"></div>
  <div><label>Bắt đầu</label><input name="startDate" type="date" value="${esc(p.startDate)}"></div><div><label>Kết thúc (để trống nếu không giới hạn)</label><input name="endDate" type="date" value="${esc(p.endDate)}"></div></div>
  ${p.img?`<div class="mut xs">Ảnh hiện tại: ${esc(p.img)}</div>`:''}
  <label>Mô tả ngắn (hiện trên thẻ ở trang chủ)</label><textarea name="summary" rows="2" maxlength="300">${esc(p.summary)}</textarea>
  <label>Nội dung chi tiết (khách bấm vào thẻ để đọc)</label><textarea name="content" rows="6" maxlength="5000">${esc(p.content)}</textarea>
  <div class="chk"><label><input type="checkbox" name="published" ${p.published?'checked':''}> Đăng lên trang chủ bán hàng</label></div><div class="mut xs" style="margin-top:6px">Bỏ chọn để lưu nháp, khách sẽ chưa thấy bài.</div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn" type="button" onclick="$('#dlg').close()">Hủy</button><button class="btn p" type="submit">Lưu bài</button></div>`;
  f.onsubmit=async e=>{e.preventDefault();const v=new FormData(f),g=k=>v.get(k),body={title:g('title'),badge:g('badge'),summary:g('summary'),content:g('content'),startDate:g('startDate'),endDate:g('endDate'),published:v.has('published'),img:p.img||''};
    try{const file=g('file');if(file&&file.size){const u=new FormData();u.append('image',file);body.img=(await api('upload',{method:'POST',body:u})).path}
      await api(id?'promotions/'+id:'promotions',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#dlg').close();toast('Đã lưu bài');await load()}catch(er){toast('Lỗi: '+er.message)}};
  $('#dlg').showModal();
}
const fabAdd=()=>S.page==='mkt'?editPromo():edit();

function trash(){return head('KHÔI PHỤC DỮ LIỆU','Thùng rác','Sản phẩm đã xóa được giữ lại để bạn khôi phục khi cần.')+`<div class="card">${TR.map(p=>`<div class="row">${thumb(p)}<div class="n"><b>${esc(p.name)}</b><span class="mut xs">Xóa lúc ${new Date(p.deletedAt).toLocaleString('vi-VN')}</span></div>
  <button class="btn e" onclick="act('trash/${p.id}/restore','POST','Đã khôi phục')">Khôi phục</button><button class="btn d" onclick="confirm('Xóa vĩnh viễn sản phẩm này?')&&act('trash/${p.id}','DELETE','Đã xóa vĩnh viễn')">Xóa vĩnh viễn</button></div>`).join('')||'<p class="mut">Thùng rác trống.</p>'}</div>`}
async function act(u,m,msg){try{await api(u,{method:m});toast(msg)}catch(e){toast('Lỗi: '+e.message)}load()}
const del=id=>confirm('Chuyển sản phẩm này vào thùng rác?')&&act('products/'+id,'DELETE','Đã chuyển vào thùng rác');

function csv(){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"',l=S.page==='dash'?getFilteredDash():flt();
  const t=[['ID','Mã','Tên','Danh mục','Giá gốc','Giá bán','Kích thước','Màu sắc','Tồn kho','Hiển thị web','Bán chạy'],...l.map(p=>[p.id,sku(p),p.name,catLabel(p.brand),p.price,p.salePrice||'',(p.size||[]).join(' | '),p.color||'',p.stock??'',p.hidden?'Không':'Có',p.isTopseller?'Có':'Không'])].map(r=>r.map(c).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download='bao-cao-enice.csv';a.click();URL.revokeObjectURL(a.href)}

function edit(id){
  const p=D.find(x=>x.id===id)||{rating:5,size:[]},f=$('#f');
  f.innerHTML=`<h3>${id?'Sửa sản phẩm':'Thêm sản phẩm'}</h3><label>Tên sản phẩm</label><input name="name" required value="${esc(p.name)}">
  <div class="two"><div><label>Mã sản phẩm (SKU)</label><input name="sku" value="${esc(p.sku)}" placeholder="EN-BT1800"></div><div><label>Danh mục</label><select name="brand">${catOpts(p.brand||'Ngâm Thường')}</select></div>
  <div><label>Giá gốc (₫)</label><input name="price" type="number" min="0" value="${p.price||''}"></div><div><label>Giá khuyến mãi (₫)</label><input name="salePrice" type="number" min="0" value="${p.salePrice||''}"></div>
  <div><label>Màu sắc</label><input name="color" value="${esc(p.color)}"></div><div><label>Tồn kho</label><input name="stock" type="number" min="0" value="${p.stock??''}"></div>
  <div><label>Đánh giá (1-5)</label><input name="rating" type="number" min="1" max="5" value="${p.rating||5}"></div><div><label>Ảnh (jpg, png, webp, tối đa 5MB)</label><input name="file" type="file" accept="image/jpeg,image/png,image/webp"></div></div>
  ${p.img1?`<div class="mut xs">Ảnh hiện tại: ${esc(p.img1)}</div>`:''}<label>Kích thước (mỗi dòng một loại)</label><textarea name="size" rows="3">${esc((p.size||[]).join('\n'))}</textarea>
  <label>Mô tả</label><textarea name="desc" rows="3">${esc(p.desc)}</textarea>
  <div class="chk"><label><input type="checkbox" name="isTopseller" ${p.isTopseller?'checked':''}> Bán chạy</label><label><input type="checkbox" name="hidden" ${p.hidden?'checked':''}> Ẩn khỏi trang bán hàng</label></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn" type="button" onclick="$('#dlg').close()">Hủy</button><button class="btn p" type="submit">Lưu</button></div>`;
  f.onsubmit=async e=>{e.preventDefault();const v=new FormData(f),g=k=>v.get(k),body={name:g('name'),sku:g('sku'),brand:g('brand'),price:g('price'),salePrice:g('salePrice'),color:g('color'),stock:g('stock'),rating:g('rating'),desc:g('desc'),
    size:g('size').split('\n').map(s=>s.trim()).filter(Boolean),isTopseller:v.has('isTopseller'),hidden:v.has('hidden'),img1:p.img1||''};
    try{const file=g('file');if(file&&file.size){const u=new FormData();u.append('image',file);body.img1=(await api('upload',{method:'POST',body:u})).path}
      await api(id?'products/'+id:'products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#dlg').close();toast('Đã lưu sản phẩm');await load()}catch(er){toast('Lỗi: '+er.message)}};
  $('#dlg').showModal();
}

$('#q').oninput=e=>{S.q=e.target.value;S.pg=0;if(S.page!=='prod'){S.page='prod';draw();$('#q').focus()}else{const q1=$('#q1');if(q1)q1.value=S.q;listP()}};
/* ---------- Màu giao diện ---------- */
const THEMES=[['','Xanh dương','#2f66f0'],['tim','Tím','#7c3aed'],['ngoc','Xanh ngọc','#047857'],['cam','Cam','#c2410c'],['hong','Hồng','#be185d'],['do','Đỏ rượu','#be123c']];
const curC=()=>document.documentElement.dataset.c||'';
const swatches=()=>THEMES.map(([k,n,c])=>`<button type="button" class="sq" data-c="${k}" style="background:${c}" title="${n}" aria-label="Màu ${n}" aria-pressed="false" onclick="setC('${k}')"></button>`).join('');
const markC=()=>document.querySelectorAll('.sq').forEach(b=>{const on=b.dataset.c===curC();b.setAttribute('aria-pressed',on);b.classList.toggle('on',on)});
function setC(c){document.documentElement.dataset.c=c;try{localStorage.setItem('c',c)}catch(_){}markC()}
const hue=s=>{let h=0;for(const ch of String(s||''))h=(h*31+ch.charCodeAt(0))%360;return h};
$('#pal .sqs').innerHTML=swatches();
$('#pl').onclick=e=>{e.stopPropagation();const p=$('#pal');p.hidden=!p.hidden;$('#pl').setAttribute('aria-expanded',String(!p.hidden));markC()};
document.addEventListener('click',e=>{const p=$('#pal');if(!p.hidden&&!p.contains(e.target)){p.hidden=true;$('#pl').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#pal').hidden=true;$('#pl').setAttribute('aria-expanded','false')}});
$('#dk').onclick=()=>{const d=document.documentElement.dataset.t==='dark'?'':'dark';document.documentElement.dataset.t=d;try{localStorage.setItem('t',d)}catch(_){}};
try{document.documentElement.dataset.t=localStorage.getItem('t')||'';document.documentElement.dataset.c=localStorage.getItem('c')||''}catch(_){}
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
$('#hb').onclick=()=>document.body.classList.toggle('nav');$('#bd').onclick=()=>document.body.classList.remove('nav');
setInterval(async()=>{if(S.page==='dash'&&!document.hidden&&!$('#dlg').open){try{ST=await api('stats');draw()}catch(_){}}},30000);
load();
</script></body></html>
