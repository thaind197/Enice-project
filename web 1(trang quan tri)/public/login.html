
<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Đăng nhập · ENICE Administration</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#1b2559,#151d4a);min-height:100vh;display:grid;place-items:center;padding:20px;color:#18214d}
.box{background:#fff;border-radius:18px;padding:32px;width:420px;max-width:100%;box-shadow:0 24px 70px #0006}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;line-height:1.1;margin-bottom:22px}
.logo i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d5df6,#4f7cf0);display:grid;place-items:center;font-style:normal;color:#fff}
.logo span{display:block;font-size:10px;font-weight:500;letter-spacing:.12em;color:#7b86a6}
h1{font-size:22px;margin-bottom:4px}.sub{color:#7b86a6;margin-bottom:18px}
label{display:block;font-size:12px;color:#5b6788;margin:12px 0 4px}
input:not([type=checkbox]){width:100%;padding:12px;border:1px solid #dde3f0;border-radius:10px;font:inherit;font-size:16px;color:#18214d}
input:focus-visible,button:focus-visible{outline:2px solid #2f66f0;outline-offset:2px}
.show{display:flex;gap:6px;align-items:center;font-size:13px;margin:12px 0 0;cursor:pointer}
.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#2f66f0;color:#fff;font:inherit;font-weight:600;cursor:pointer;min-height:46px}.btn:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin-top:14px;font-size:13px;color:#d6303a}
@media(max-width:480px){.box{padding:24px 20px}}
</style></head><body>
<div class="box">
  <div class="logo"><i>E</i><div>ENICE<span>ADMINISTRATION</span></div></div>
  <h1>Đăng nhập quản trị</h1><div class="sub">Chỉ dành cho quản trị viên của ENICE.</div>
  <form id="f" autocomplete="on">
    <label for="u">Tên đăng nhập</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Mật khẩu</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <label class="show"><input type="checkbox" onchange="document.getElementById('p').type=this.checked?'text':'password'"> Hiện mật khẩu</label>
    <button class="btn">Đăng nhập</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</div>
<script>
const $=s=>document.querySelector(s);
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('.btn');b.disabled=true;$('#msg').textContent='';
  try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value.trim(),password:$('#p').value})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Có lỗi xảy ra, hãy thử lại.');location.replace('/')}
  catch(er){$('#msg').textContent=er.message;$('#p').value='';b.disabled=false}};
fetch('/auth/state').then(r=>r.json()).then(s=>{if(s.loggedIn)location.replace('/');else $('#u').focus()}).catch(()=>{$('#msg').textContent='Không kết nối được máy chủ.'});
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
</script></body></html>
